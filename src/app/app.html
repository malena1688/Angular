
<h1>¡Hola Mundo!</h1>

<p>Estoy aprendiendo Angular 21.</p>

<h2>Mis datos personales</h2>
<p>Me llamo {{ nombre }}</p>
<p>Tengo {{ edad }} años</p>
<p>El año que viene tendré {{ edad + 1 }} años</p>

<h2>Mi primer Property Binding</h2>
<button [disabled]="botonDesactivado">
  Enviar
</button>

<h2>Mi primer Event Binding</h2>
<button (click)="mostrarMensaje()">
  Mostrar mensaje
</button>

<p>{{ mensaje }}</p>

<app-footer></app-footer>
